name: Build Android APK

# 걷기 포인트 설치파일(APK) 만들기. 스마트비서 앱(voice-memo-native)의 android.yml 과 같은 구조입니다.
# 웹 화면 파일(index.html, js, css 등)만 바꾼 커밋은 앱이 웹을 직접 불러오므로 다시 만들지 않습니다.
on:
  push:
    branches: [ master ]
    paths:
      - 'android/**'
      - 'app-www/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # 설치파일을 「Release」에 올리기 위해(저장소 기본 토큰 사용, 따로 등록할 비밀값 없음)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      # ubuntu-latest 러너엔 Android SDK 가 이미 있다. 라이선스만 수락한다.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # ---- 서명키 ----
      # 1순위: 저장소 Secrets 에 고정 키(ANDROID_KEYSTORE_B64 등 4개)가 있으면 그것을 쓴다(스마트비서와 같은 방식).
      # 2순위: 없으면 이전 빌드가 저장해 둔 키(Actions 캐시)를 쓰고,
      # 3순위: 그것도 없으면 이번에 새로 만든다(이 경우 이전 설치본 위에 덮어설치가 안 될 수 있음 - README 참고).
      # 키·비밀번호는 저장소에 커밋되지 않고 로그에도 찍지 않는다.
      - name: Restore saved signing key (cache)
        uses: actions/cache@v4
        with:
          path: android/signing
          key: walkpoints-signing-v1
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/signing
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > android/signing/walkpoints.keystore
            echo "PT_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "PT_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "PT_KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}" >> "$GITHUB_ENV"
            echo "SIGN_MODE=secret" >> "$GITHUB_ENV"
          else
            if [ ! -f android/signing/walkpoints.keystore ] || [ ! -f android/signing/pass.txt ]; then
              PW=$(openssl rand -hex 24)
              echo "::add-mask::$PW"
              keytool -genkeypair -v -keystore android/signing/walkpoints.keystore -alias walkpoints \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
                -dname "CN=Walk Points, O=Family" > /dev/null 2>&1
              printf '%s' "$PW" > android/signing/pass.txt
              echo "SIGN_MODE=new" >> "$GITHUB_ENV"
            else
              echo "SIGN_MODE=cache" >> "$GITHUB_ENV"
            fi
            PW=$(cat android/signing/pass.txt)
            echo "::add-mask::$PW"
            echo "PT_STORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "PT_KEY_ALIAS=walkpoints" >> "$GITHUB_ENV"
            echo "PT_KEY_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi

      - name: Install JS deps
        run: npm install --no-audit --no-fund
      - name: Capacitor sync (copy web + plugins into android)
        run: npx cap sync android
      - name: Build debug APK (signed with the key above)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PptStoreFile=../signing/walkpoints.keystore \
            -PptStorePassword="$PT_STORE_PASSWORD" \
            -PptKeyAlias="$PT_KEY_ALIAS" \
            -PptKeyPassword="$PT_KEY_PASSWORD"

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: walk-points-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 로그인 없이 내려받을 수 있는 고정 링크(Release)에도 올린다: 저장소 > Releases > apk-latest
      - name: Publish APK to Release (apk-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk walk-points.apk
          gh release delete apk-latest --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create apk-latest walk-points.apk \
            --title "걷기 포인트 설치파일 (APK)" \
            --notes "걷기 포인트 안드로이드 설치파일입니다. 서명 방식: ${SIGN_MODE}. 설치 방법은 저장소 README 를 보세요." \
            --target "${{ github.sha }}"
