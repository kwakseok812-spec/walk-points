# 걷기 포인트 앱용 Supabase 설정 메모 (새 프로젝트 전용). 호스팅 프로젝트에서는 대시보드에서 직접 맞춥니다.
# - Authentication > Sign In / Providers > 「Allow new users to sign up」 끄기 (공개 가입 닫음)
# - Authentication > Sessions 의 「Time-box」「Inactivity timeout」 비우기 (로그인이 강제로 끊기지 않게)
# - Edge Functions > pt-auth > 「Verify JWT」 끄기 (로그인 전에 부르는 함수)
[auth]
enable_signup = false

[functions.pt-auth]
verify_jwt = false
