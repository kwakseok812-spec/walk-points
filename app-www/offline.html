<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>걷기 포인트</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;
       background:#f6f5f0;color:#1a1c1a;font:22px/1.5 "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#101211;color:#f0f1ee}}
  h1{font-size:1.5rem;margin:0 0 12px}
  p{margin:0 0 24px}
  button{min-height:64px;padding:0 32px;border:0;border-radius:18px;background:#7B1E3A;color:#fff;font:inherit;font-weight:800}
  button:active{transform:scale(.97)}
</style></head>
<body><main>
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>와이파이나 데이터 연결을 확인한 뒤<br>아래 「다시 시도」를 눌러 주세요.<br>기록은 서버에 안전하게 있습니다.</p>
  <button id="retry">다시 시도</button>
</main>
<script>
  var URL_ = "https://kwakseok812-spec.github.io/walk-points/";
  function go(){ location.href = URL_; }
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', go);   // 연결이 돌아오면 저절로 다시 열기
</script></body></html>
